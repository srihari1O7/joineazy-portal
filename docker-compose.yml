services:
  db:
    image: postgres:16-alpine
    container_name: joineazy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: joineazy
      POSTGRES_PASSWORD: joineazy_pass
      POSTGRES_DB: joineazy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata: